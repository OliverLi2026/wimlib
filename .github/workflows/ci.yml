name: CI

# 修改触发条件：当推送形如 v1.0.0 的标签时触发
on:
  push:
  - tags:
    - 'v*'

env:
  DEF_CFLAGS: -O2 -g -Wall -Werror

jobs:
  windows-build:
    name: Build on Windows
    runs-on: windows-latest
    strategy:
      matrix:
        include:
        - { msystem: MINGW32, cc_pkg: mingw-w64-i686-gcc }
        - { msystem: MINGW64, cc_pkg: mingw-w64-x86_64-gcc }
        - { msystem: CLANG64, cc_pkg: mingw-w64-clang-x86_64-clang }
        - { msystem: CLANGARM64, options: --install-prerequisites }
    defaults:
      run:
        shell: msys2 {0}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - uses: msys2/setup-msys2@v2
      with:
        msystem: ${{matrix.msystem}}
        update: true
        install: >
          autoconf
          automake
          git
          libtool
          make
          ${{matrix.cc_pkg}}
          pkgconf
    - run: CFLAGS="$DEF_CFLAGS" ./tools/windows-build.sh ${{matrix.options}}
    - uses: actions/upload-artifact@v4
      with:
        name: windows-${{matrix.msystem}}-bin
        path: wimlib-*-bin

  create-release:
    needs: windows-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all workflow artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Prepare release files and generate SHA512
        run: |
          mkdir -p final-release
          cd release-artifacts
          
          for dir in windows-*-bin/; do
            if [ -d "$dir" ]; then
              pkg_name="${dir%/}"
              
              if [[ "$pkg_name" == *"MINGW32"* || "$pkg_name" == *"MINGW64"* ]]; then
                echo "打包 $pkg_name 为 ZIP 格式..."
                zip -r "../final-release/${pkg_name}.zip" "$dir"
              else
                echo "打包 $pkg_name 为 TAR.GZ 格式..."
                tar -czvf "../final-release/${pkg_name}.tar.gz" "$dir"
              fi
            fi
          done
          cd ..
          
          cd final-release
          sha512sum * > sha512sums.txt
          cd ..
          
          echo "=== 检查最终打包好的文件及校验码 ==="
          ls -la final-release/

      # 1. 先生成构建来历安全签名
      - name: Generate Artifact Attestations
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: 'final-release/*'

      # 2. 上传打包文件到对应的 GitHub Release 中
      - name: Upload Release Assets
        uses: softprops/action-gh-release@v3
        with:
          files: final-release/*
          prerelease: true
