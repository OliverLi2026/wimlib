name: CI

on:
  push:
    tags:
      - 'v*'

env:
  DEF_CFLAGS: -O2 -g -Wall -Werror

jobs:
  windows-build:
    name: Build on Windows
    runs-on: windows-latest
    strategy:
      matrix:
        include:
        - { msystem: MINGW32, cc_pkg: mingw-w64-i686-gcc }
        - { msystem: MINGW64, cc_pkg: mingw-w64-x86_64-gcc }
        - { msystem: CLANG64, cc_pkg: mingw-w64-clang-x86_64-clang }
        - { msystem: CLANGARM64, options: --install-prerequisites }
    defaults:
      run:
        shell: msys2 {0}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - uses: actions/setup-msys2@v2
      with:
        msystem: ${{matrix.msystem}}
        update: true
        install: >
          autoconf
          automake
          git
          libtool
          make
          ${{matrix.cc_pkg}}
          pkgconf
    - run: CFLAGS="$DEF_CFLAGS" ./tools/windows-build.sh ${{matrix.options}}
    - uses: actions/upload-artifact@v4
      with:
        name: windows-${{matrix.msystem}}-bin
        path: wimlib-*-bin

  create-release:
    needs: windows-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Download all workflow artifacts
      uses: actions/download-artifact@v4
      with:
        path: release-artifacts

    - name: Prepare release files and generate SHA512
      run: |
        mkdir -p final-release
        cd release-artifacts
        
        for dir in windows-*-bin/; do
          if [ -d "$dir" ]; then
            pkg_name="${dir%/}"
            
            if [[ "$pkg_name" == *"MINGW32"* || "$pkg_name" == *"MINGW64"* ]]; then
              echo "打包 $pkg_name 为 ZIP 格式..."
              zip -r "../final-release/${pkg_name}.zip" "$dir"
            else
              echo "打包 $pkg_name 为 TAR.GZ 格式..."
              tar -czvf "../final-release/${pkg_name}.tar.gz" "$dir"
            fi
          fi
        done
        cd ..
        
        cd final-release
        sha512sum * > sha512sums.txt
        cd ..
        
        echo "=== 检查最终打包好的文件及校验码 ==="
        ls -la final-release/

    - name: Generate Artifact Attestations
      uses: actions/attest-build-provenance@v1
      with:
        subject-path: 'final-release/*'

    - name: Upload to GitHub Release
      uses: softprops/action-gh-release@v3
      with:
        files: final-release/*
        tag_name: ${{ github.ref_name }}
        name: "Release ${{ github.ref_name }}"
        body: "自动构建的版本，内含 SHA512 校验文件与 GitHub 官方安全签名认证 (Artifact Attestations)。"
        prerelease: true
        overwrite_files: true
