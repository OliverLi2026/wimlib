name: CI

on:
  push:
    tags:
      - 'v*'

env:
  DEF_CFLAGS: -O2 -g -Wall -Werror

jobs:
  windows-build:
    name: Build on Windows
    runs-on: windows-latest
    strategy:
      matrix:
        include:
        - { msystem: MINGW32, cc_pkg: mingw-w64-i686-gcc }
        - { msystem: MINGW64, cc_pkg: mingw-w64-x86_64-gcc }
        - { msystem: CLANG64, cc_pkg: mingw-w64-clang-x86_64-clang }
        - { msystem: CLANGARM64, options: --install-prerequisites }
    defaults:
      run:
        shell: msys2 {0}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - uses: actions/setup-msys2@v2
      with:
        msystem: ${{matrix.msystem}}
        update: true
        install: >
          autoconf
          automake
          git
          libtool
          make
          ${{matrix.cc_pkg}}
          pkgconf
    - run: CFLAGS="$DEF_CFLAGS" ./tools/windows-build.sh ${{matrix.options}}
    - uses: actions/upload-artifact@v4
      with:
        name: windows-${{matrix.msystem}}-bin
        path: wimlib-*-bin

  create-release:
    needs: windows-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all workflow artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Prepare release files and generate SHA512
        run: |
          mkdir -p final-release
          cd release-artifacts
          
          for dir in windows-*-bin/; do
            if [ -d "$dir" ]; then
              pkg_name="${dir%/}"
              if [[ "$pkg_name" == *"MINGW32"* || "$pkg_name" == *"MINGW64"* ]]; then
                zip -r "../final-release/${pkg_name}.zip" "$dir"
              else
                tar -czvf "../final-release/${pkg_name}.tar.gz" "$dir"
              fi
            fi
          done
          cd ..
          
          cd final-release
          sha512sum * > sha512sums.txt
          cd ..
          
          echo "=== 待打包文件列表 ==="
          ls -lh final-release/

      # 生成 Attestation 并把对应的 JSON Bundle 保存到 final-release 目录下
      - name: Generate Artifact Attestations
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: 'final-release/*'
          bundle-path: 'final-release/attestation-bundle.json'

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          # 通过通配符把 zip、tar.gz、sha512sums.txt 以及刚刚生成的 attestation-bundle.json 全部上传
          files: |
            final-release/*.zip
            final-release/*.tar.gz
            final-release/sha512sums.txt
            final-release/attestation-bundle.json
          tag_name: ${{ github.ref_name }}
          name: "Release ${{ github.ref_name }}"
          body: "自动构建的版本，内含所有编译产物、SHA512 校验文件以及离线安全签名证明 (attestation-bundle.json)。"
          prerelease: true
          overwrite_files: true
