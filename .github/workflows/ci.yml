name: CI
on: [pull_request, push]
env:
  DEF_CFLAGS: -O2 -g -Wall -Werror

jobs:
  windows-build:
    name: Build on Windows
    runs-on: windows-latest
    strategy:
      matrix:
        include:
        - { msystem: MINGW32, cc_pkg: mingw-w64-i686-gcc }
        - { msystem: MINGW64, cc_pkg: mingw-w64-x86_64-gcc }
        - { msystem: CLANG64, cc_pkg: mingw-w64-clang-x86_64-clang }
        - { msystem: CLANGARM64, options: --install-prerequisites }
    defaults:
      run:
        shell: msys2 {0}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Need tags for tools/get-version-number.sh
    - uses: msys2/setup-msys2@v2
      with:
        msystem: ${{matrix.msystem}}
        update: true
        install: >
          autoconf
          automake
          git
          libtool
          make
          ${{matrix.cc_pkg}}
          pkgconf
    - run: CFLAGS="$DEF_CFLAGS" ./tools/windows-build.sh ${{matrix.options}}
    - uses: actions/upload-artifact@v4
      with:
        name: windows-${{matrix.msystem}}-bin
        path: wimlib-*-bin

  create-release:
    needs: windows-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - name: Download all workflow artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Prepare release files and generate SHA512
        run: |
          mkdir -p final-release
          cd release-artifacts
          
          for dir in windows-*-bin/; do
            if [ -d "$dir" ]; then
              pkg_name="${dir%/}"
              
              if [[ "$pkg_name" == *"MINGW32"* || "$pkg_name" == *"MINGW64"* ]]; then
                echo "打包 $pkg_name 为 ZIP 格式..."
                zip -r "../final-release/${pkg_name}.zip" "$dir"
              else
                echo "打包 $pkg_name 为 TAR.GZ 格式..."
                tar -czvf "../final-release/${pkg_name}.tar.gz" "$dir"
              fi
            fi
          done
          cd ..
          
          # 进入最终发布目录，计算所有文件的 sha512 并写入 sha512sums.txt
          cd final-release
          sha512sum * > sha512sums.txt
          cd ..
          
          echo "=== 检查最终打包好的文件及校验码 ==="
          ls -la final-release/

          # 提取短 SHA 供后续动态 Tag 使用
          echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Generate Artifact Attestations
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: 'final-release/*'

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: final-release/*
          tag_name: "nightly-${{ env.SHORT_SHA }}"
          name: "Nightly Build (${{ env.SHORT_SHA }})"
          body: "自动构建的最新开发版，本版本包含 GitHub 官方安全签名认证 (Artifact Attestations)。"
          prerelease: true
          # 加上 overwrite_files，允许在同一 Release 内覆盖同名文件（如果后续有需要）
          overwrite_files: true
